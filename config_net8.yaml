      sha256: 349fca6c99aea2d1414789a94fe6a0f436ec97e9acb042edc0431c5e2a96ed36
      label: "graph_nolstm family, training seed 2005 (no headline seed)"
  allow_test_split: true   # D-76: single eight-node test run (owner, 2026-11-19); test_lock_net8.json refuses a second
  smoke:                   # Phase 5 smoke test (D-26)
    nodes:
      - {id: S1, type: supplier}
      - {id: W1, type: warehouse, supplier: S1}
      - {id: St1, type: store, m5_store: CA_1, warehouse: W1}
    max_updates: 300
    min_updates: 100
    training_seeds: [1001]
dashboard:                 # Phase 4 simulation dashboard (DECISIONS D-33, D-39, D-41)
  replay_seed: 1           # the run that is replayed; KPI cards use all evaluation seeds
  reference_policy: basestock   # KPI differences are shown against this policy (D-33 b)
  # Map colours by days of cover = end-of-day stock / the node's average daily demand on training
  # days. Chosen from training and validation days (D-39): below `critical` a store stocks out the
  # next day in 29 to 49% of cases and a warehouse rations in 57 to 84%; at or above `low` in 0 to 3%
  # (stores) and 7 to 11% (base-stock warehouse).
  cover_days:
    store:     {critical: 1.0, low: 1.5}
    warehouse: {critical: 0.25, low: 1.0}
  play_speeds: [1, 2, 5]   # simulated days per second (target)
  chart_window_days: 60    # width of the charts' follow-the-day view
  # Custom shocks are demonstration only (D-41). A learned policy is added to this list only after
  # its single official evaluation on the test days.
  custom_policies: [warmup, basestock, movavg]
  # Phase 7 (D-64): graph policies whose attention weights are written beside their logs during
  # the single test run (the attention panel reads them; no learned policy runs on test days again)
  attention_policies: []   # D-72 (l): no attention recording on eight nodes
