# All chosen settings (source tag C). Derived dataset facts live in derived.yaml, not here.
project:
  seed: 42
  n_eval_seeds: 20
data:
  m5_dir: data/raw/m5
  dataco_csv: data/raw/dataco/DataCoSupplyChainDataset.csv
  dataco_encoding: latin-1
  # item_id and first_day are RESULTS of the item-choice algorithm (manual 6.2); they are recorded
  # in derived.yaml (DECISIONS.md D-3), not here.
  min_nonzero_share: 0.9   # item selection: minimum share of non-zero sales days
network:                   # prototype network (four nodes)
  nodes:
    - {id: S1, type: supplier}
    - {id: W1, type: warehouse, supplier: S1}
    - {id: St1, type: store, m5_store: CA_1, warehouse: W1}
    - {id: St2, type: store, m5_store: CA_3, warehouse: W1}
  edge_mode:
    supplier_to_warehouse: Standard Class
    warehouse_to_store: Second Class
  add_reverse_edges: true
splits:
  train: [1, 1500]
  val: [1501, 1700]
  test: [1701, 1941]
sim:
  history_window: 7        # graphs per observation (today included)
  warmup_days: 6           # history_window - 1
  episode_decision_days: 60
  min_lead_time: 1
  order_cap_multiple: 3.0  # cap = multiple x average daily demand of the node
  start_stock_days_store: 3
  start_stock_days_warehouse: 7
  start_pipeline_days: [1, 2, 3, 4]   # pre-loaded shipments due on these days (DECISIONS D-13)
  cost_holding: 0.05       # per unit of end-of-day stock, every stocking node
  cost_stockout: 1.0       # per unit short, stores only
  cost_order_change: 0.1   # per unit of change from yesterday's order
  reward_scale: auto       # divide by the sum of the stores' avg_d (DECISIONS D-14)
  supplier_capacity: unlimited
shocks: []                 # list of shock records (manual Section 7.3)
baselines:
  basestock_grid: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]   # x avg demand x (mean lead time + 1)
  movavg_z_grid:  [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
  refine_step: 0.05        # fine search within one coarse step of the best value (DECISIONS D-19)
  tuning_seeds: [101, 102, 103, 104, 105]   # training days only; evaluation uses seeds 1..n_eval_seeds
  tuning_objective: total_cost   # holding + stockout (manual 10.2); full_cost adds order changes (D-19)
scenarios:                 # Phase 3 evaluation scenarios on the test days (manual 10.3), one shock each
  window: [1750, 1759]     # inclusive shock days (43 decision days before, 182 after)
  shocks:
    transit_delay:  {type: transit_delay, target: W1->St1, delta_days: 3}
    demand_spike:   {type: demand_spike, target: [St1], k: 1.5}
    # u = demand uplift of the discount (assumed, ASSUMPTIONS A14, DECISIONS D-23): M5 price cuts
    # of other FOODS items in CA_1/CA_3 give 0.17 (95% 0.04 to 0.48; supply_chain_rl.data.uplift)
    price_discount: {type: price_discount, target: [St1], d: 0.2, u: 0.2}
    price_discount_high: {type: price_discount, target: [St1], d: 0.2, u: 0.5}   # sensitivity: top of the range
    combined: {shocks: [transit_delay, demand_spike]}   # D-63: both at St1 in the same window
rl:
  embed_dim: 16            # Phase 6 (graph encoder, D-55)
  gat_layers: 2
  lstm_hidden: 16
  pretrain_encoder: false  # superseded by the per-variant `pretrain` flag (D-57)
  graph_head_hidden: [64]  # shared actor head and critic head on the node summaries
  phase6_target_kl: null   # KL stop tried at 0.015 and not adopted (D-54); Phase 5 updates
  phase6_dir: checkpoints/phase6   # not committed; back this folder up
  variants:                # Phase 6 ablations (D-57); graph defaults: lstm true, no dropped features
    flat: {model: flat}
    graph_nolstm: {lstm: false}
    graph_lstm: {}
    graph_lstm_no_wd_snap: {drop_features: [sin_wd, cos_wd, snap]}
    graph_lstm_no_event: {drop_features: [event]}
    graph_lstm_no_price: {drop_features: [price]}
    graph_lstm_pretrained: {pretrain: true}
    flat_shock: {model: flat, train_shocks: true}   # D-62, the D-27 variant (ppo_shock)
  train_shocks:            # D-62: hidden shocks in training episodes of flat_shock only
    prob: 0.5              # one shock per episode with this probability, else none
    length_days: 10        # the test window length
    types: [transit_delay, demand_spike, price_discount]   # uniform; S4 never used
    delay_days: [1, 4]     # integers, inclusive (test: 3), one random road
    spike_k: [1.2, 1.8]    # uniform (test: 1.5), one random store
    discount_d: 0.2        # as the test scenarios
    discount_u: [0.1, 0.6] # uniform (tests: 0.2 and 0.5), one random store
  g3b:                     # D-60: post-hoc hypothesis (graph_lstm beats flat), tested on fresh seeds
    training_seeds: [1004, 1005, 1006, 1007, 1008]
    flat: flat
    contender: graph_lstm
    secondary: graph_nolstm
    split: val
    per_seed_z: 1.96       # interval over evaluation seeds 1-20 (Phase 3 rule)
    mean_interval: t_over_training_seeds   # t(0.975, 4) = 2.776 over the 5 per-seed means
    min_seeds_clearly_better: 4
    checkpoint_dir: checkpoints/g3b        # <model>_s<seed>/; not committed; back this folder up
  pretrain:                # encoder pretraining on next-day store demand (D-58)
    episodes: 400          # base-stock training episodes of 60 decision days (windows)
    val_episodes: 0        # 0 = the whole validation stretch, evaluation seeds of pretraining below
    seed_stream: pretrain
    epochs: 30
    lr: 0.001
    minibatch_size: 256
  # PPO (Phase 5; manual 12.1 as amended by D-35; settings of D-48 to D-50)
  discount: 0.99
  gae_lambda: 0.95
  clip: 0.2
  steps_per_update: 1920   # whole episodes only: n_envs x 4 episodes x 60 decision days (D-50)
  lr: 0.0003
  n_envs: 8                # training episodes played side by side
  flat_hidden: [128, 128]  # actor and critic: two tanh layers each, separate networks
  epochs_per_update: 10
  minibatch_size: 256
  entropy_coef: 0.001
  value_coef: 0.5
  max_grad_norm: 0.5       # applied to actor and critic separately
  init_mean_fraction: 0.3333   # starting mean action = average demand (D-35 a)
  init_std: 0.10           # starting spread, in fractions of the cap (D-35 a)
  eval_every_updates: 10
  selection_seeds: [201, 202, 203, 204, 205]   # checkpoint selection on validation days (D-35 d)
  min_updates: 200
  max_updates: 1000
  patience_evals: 15       # stop after this many evaluations without a lower validation cost
  training_seeds: [1001, 1002, 1003]   # at least three (D-35 e)
  train_start_stock_days:  # starting stock drawn per node in training episodes only (D-35 c, D-49)
    store: [0.5, 4.0]
    warehouse: [0.25, 8.0]
  device: cpu              # measured faster than the GPU for these networks (D-48)
  torch_threads: 1
  checkpoint_dir: checkpoints/phase5   # not committed; back this folder up
  selected_checkpoint: checkpoints/phase5/ppo_selected.pt   # the policy registered as "ppo"
  evaluated:               # D-61: frozen list for the single learned test run (SHA-256 checked on load)
    graph_lstm:
      checkpoint: checkpoints/g3b/graph_lstm_s1005/best.pt
